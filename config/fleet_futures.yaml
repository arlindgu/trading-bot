# Every account cli/futures_fleet.py runs, sharing ONE demo-account futures
# wallet split by margin asset (USDT / USDC). USDT side stays "moderate"
# (Coinflip's original 1-5x leverage, real technical strategies), USDC side
# stays "chaotic" (higher/random leverage, joke strategies) -- matching the
# flavor split this project already established for Coinflip itself.
#
# Budget check: USDT side = coinflip_usdt (500) + 4 new real scalps (2,000)
# = 2,500 of 5,000. USDC side = coinflip_usdc (500) + 2 new joke scalps
# (1,000) = 1,500 of 5,000. Both comfortably under the real balance.
accounts:
  - account: coinflip_usdt_500
    margin_asset: USDT
    strategy: coinflip
    total_cash: 500
    timeframe: 1h
    params: {leverage_choices: [1, 2, 3, 5], margin_pct: 0.03, max_concurrent: 3}

  - account: coinflip_usdc_500
    margin_asset: USDC
    strategy: coinflip
    total_cash: 500
    timeframe: 1h
    params: {leverage_choices: [1, 2, 3, 5, 10, 20], margin_pct: 0.03, max_concurrent: 3}

  # 3 new real (technical) high-frequency strategies -- USDT side, 1m bars.
  - account: rsi_scalp_500
    margin_asset: USDT
    strategy: rsi_scalp
    total_cash: 500
    timeframe: 1m
    params: {margin_pct: 0.03, leverage: 3, period: 14, oversold: 20.0, overbought: 80.0}

  - account: ema_scalp_500
    margin_asset: USDT
    strategy: ema_scalp
    total_cash: 500
    timeframe: 1m
    params: {margin_pct: 0.03, leverage: 3, fast_period: 5, slow_period: 13}

  - account: momentum_scalp_500
    margin_asset: USDT
    strategy: momentum_scalp
    total_cash: 500
    timeframe: 1m
    params: {margin_pct: 0.03, leverage: 3, lookback_bars: 5}

  - account: candle_reversal_500
    margin_asset: USDT
    strategy: candle_reversal
    total_cash: 500
    timeframe: 1m
    params: {margin_pct: 0.03, leverage: 3}

  # 2 new joke high-frequency strategies -- USDC side, 1m bars.
  - account: adrenaline_junkie_500
    margin_asset: USDC
    strategy: adrenaline_junkie
    total_cash: 500
    timeframe: 1m
    params: {margin_pct: 0.03, leverage_choices: [1, 2, 3, 5, 10]}

  - account: panic_bot_500
    margin_asset: USDC
    strategy: panic_bot
    total_cash: 500
    timeframe: 1m
    params: {margin_pct: 0.03, leverage: 5, panic_threshold: 0.001}
