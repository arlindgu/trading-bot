# Grid trading auf UNI/USDT (Binance, oeffentliche Daten, kein Live-Handel).
strategy: grid
symbol: UNI/USDT
exchange: binance
timeframe: 1h
lookback_days: 3500  # volle verfuegbare Binance-Historie (seit UNI-Listing)

# Preisspanne, die das Grid abdeckt. UNI schwankte in der gesamten Historie
# zwischen ca. 0.30 und 45.00 (aktuell ~6.96) -- Range deckt das mit Puffer ab.
lower_price: 0.25
upper_price: 50
num_grids: 20
geometric: true  # geometrische Abstaende = gleiche %-Schritte, besser fuer breite Crypto-Ranges

risk_pct_per_grid: [0.0075, 0.0125]
fee_pct: 0.001
slippage_pct: 0.0005

initial_cash: 500
