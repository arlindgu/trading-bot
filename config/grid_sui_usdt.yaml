# Grid trading auf SUI/USDT (Binance, oeffentliche Daten, kein Live-Handel).
strategy: grid
symbol: SUI/USDT
exchange: binance
timeframe: 1h
lookback_days: 3500  # volle verfuegbare Binance-Historie (seit SUI-Listing)

# Preisspanne, die das Grid abdeckt. SUI schwankte in der gesamten Historie
# zwischen ca. 0.10 und 5.37 (aktuell ~0.83) -- Range deckt das mit Puffer ab.
lower_price: 0.08
upper_price: 6.00
num_grids: 20
geometric: true  # geometrische Abstaende = gleiche %-Schritte, besser fuer breite Crypto-Ranges

risk_pct_per_grid: [0.0075, 0.0125]
fee_pct: 0.001
slippage_pct: 0.0005

initial_cash: 500
