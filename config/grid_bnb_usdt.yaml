# Grid trading auf BNB/USDT (Binance, oeffentliche Daten, kein Live-Handel).
strategy: grid
symbol: BNB/USDT
exchange: binance
timeframe: 1h
lookback_days: 3500  # volle verfuegbare Binance-Historie

# Preisspanne, die das Grid abdeckt. BNB schwankte in der gesamten Historie
# zwischen ca. 0.50 und 1375 (aktuell ~758) -- Range deckt das mit Puffer ab.
lower_price: 0.4
upper_price: 1500
num_grids: 20
geometric: true  # geometrische Abstaende = gleiche %-Schritte, besser fuer breite Crypto-Ranges

risk_pct_per_grid: 0.01
fee_pct: 0.001
slippage_pct: 0.0005

initial_cash: 500
