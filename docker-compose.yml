x-bot-base: &bot-base
  build: .
  env_file: .env
  volumes:
    - ./paper_state:/app/paper_state
  restart: unless-stopped

services:
  # Every spot-side account (grid + the long/flat real & joke strategies)
  # in ONE process against the demo account's spot wallet -- see
  # cli/spot_fleet.py and config/fleet_spot.yaml for the account list and
  # why this replaced one container per account/budget-tier.
  spot-fleet:
    <<: *bot-base
    command: python -u cli/spot_fleet.py config/fleet_spot.yaml

  # Every coinflip (futures) account in ONE process against the demo
  # account's futures wallet -- see cli/futures_fleet.py and
  # config/fleet_futures.yaml.
  futures-fleet:
    <<: *bot-base
    command: python -u cli/futures_fleet.py config/fleet_futures.yaml

  webapp:
    build: .
    command: gunicorn -w 2 -b 0.0.0.0:8080 webapp.app:app
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./paper_state:/app/paper_state
    restart: unless-stopped
    depends_on:
      - spot-fleet
      - futures-fleet
