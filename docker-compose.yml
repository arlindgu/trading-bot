services:
  bot-testnet:
    build: .
    command: >
      python -u cli/portfolio_paper_trade.py
      --testnet --account alts8_testnet
      --total-cash 500 --risk-pct 0.03 --poll-seconds 300
      config/grid_link_usdt.yaml config/grid_tia_usdt.yaml config/grid_dot_usdt.yaml
      config/grid_eth_usdt.yaml config/grid_wif_usdt.yaml config/grid_avax_usdt.yaml
      config/grid_sol_usdt.yaml config/grid_arb_usdt.yaml
    env_file: .env
    volumes:
      - ./paper_state:/app/paper_state
    restart: unless-stopped

  bot-paper10k:
    build: .
    command: >
      python -u cli/portfolio_paper_trade.py
      --account alts8_paper10k
      --total-cash 10000 --poll-seconds 300
      config/grid_link_usdt.yaml config/grid_tia_usdt.yaml config/grid_dot_usdt.yaml
      config/grid_eth_usdt.yaml config/grid_wif_usdt.yaml config/grid_avax_usdt.yaml
      config/grid_sol_usdt.yaml config/grid_arb_usdt.yaml
    volumes:
      - ./paper_state:/app/paper_state
    restart: unless-stopped

  webapp:
    build: .
    command: gunicorn -w 2 -b 0.0.0.0:8080 webapp.app:app
    ports:
      - "8080:8080"
    volumes:
      - ./paper_state:/app/paper_state
    restart: unless-stopped
    depends_on:
      - bot-testnet
      - bot-paper10k
