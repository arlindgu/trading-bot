x-bot-base: &bot-base
  build: .
  env_file: .env
  volumes:
    - ./paper_state:/app/paper_state
  restart: unless-stopped

services:
  bot-500:
    <<: *bot-base
    command: >
      python -u cli/portfolio_paper_trade.py
      --testnet --account alts8_testnet_500
      --total-cash 500 --risk-pct 0.03 --poll-seconds 300
      config/grid_link_usdt.yaml config/grid_tia_usdt.yaml config/grid_dot_usdt.yaml
      config/grid_eth_usdt.yaml config/grid_wif_usdt.yaml config/grid_avax_usdt.yaml
      config/grid_sol_usdt.yaml config/grid_arb_usdt.yaml

  bot-1000:
    <<: *bot-base
    command: >
      python -u cli/portfolio_paper_trade.py
      --testnet --account alts8_testnet_1000
      --total-cash 1000 --risk-pct 0.02 --poll-seconds 300
      config/grid_link_usdt.yaml config/grid_tia_usdt.yaml config/grid_dot_usdt.yaml
      config/grid_eth_usdt.yaml config/grid_wif_usdt.yaml config/grid_avax_usdt.yaml
      config/grid_sol_usdt.yaml config/grid_arb_usdt.yaml

  bot-2000:
    <<: *bot-base
    command: >
      python -u cli/portfolio_paper_trade.py
      --testnet --account alts8_testnet_2000
      --total-cash 2000 --risk-pct 0.015 --poll-seconds 300
      config/grid_link_usdt.yaml config/grid_tia_usdt.yaml config/grid_dot_usdt.yaml
      config/grid_eth_usdt.yaml config/grid_wif_usdt.yaml config/grid_avax_usdt.yaml
      config/grid_sol_usdt.yaml config/grid_arb_usdt.yaml

  bot-4000:
    <<: *bot-base
    command: >
      python -u cli/portfolio_paper_trade.py
      --testnet --account alts8_testnet_4000
      --total-cash 4000 --risk-pct 0.01 --poll-seconds 300
      config/grid_link_usdt.yaml config/grid_tia_usdt.yaml config/grid_dot_usdt.yaml
      config/grid_eth_usdt.yaml config/grid_wif_usdt.yaml config/grid_avax_usdt.yaml
      config/grid_sol_usdt.yaml config/grid_arb_usdt.yaml

  bot-8000:
    <<: *bot-base
    command: >
      python -u cli/portfolio_paper_trade.py
      --testnet --account alts8_testnet_8000
      --total-cash 8000 --risk-pct 0.01 --poll-seconds 300
      config/grid_link_usdt.yaml config/grid_tia_usdt.yaml config/grid_dot_usdt.yaml
      config/grid_eth_usdt.yaml config/grid_wif_usdt.yaml config/grid_avax_usdt.yaml
      config/grid_sol_usdt.yaml config/grid_arb_usdt.yaml

  # Coinflip strategy: real long/short + leverage via Binance Futures Demo
  # Trading, purely random entries/exits (see tradingbot/strategies/coinflip.py).
  # Two groups sharing the same demo account: USDT-margined with moderate
  # leverage (1-5x), USDC-margined with chaotic leverage (1-20x) -- DOT has
  # no USDC perpetual, so those 5 bots trade the other 7 symbols. Tiers are
  # staggered but sum to <= the demo account's actual balance per margin
  # asset (5,000 USDT / 5,000 USDC) -- each bot's --total-cash is only a
  # self-tracked budget cap, not real segregated funds, so tiers that summed
  # above the real balance (the old 500/1000/2000/4000/8000 = 15,500) would
  # eventually hit real "insufficient balance" errors once enough bots were
  # concurrently in positions.
  coinflip-usdt-500:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdt_500 --total-cash 500
      --margin-asset USDT --leverage 1,2,3,5 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdt-750:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdt_750 --total-cash 750
      --margin-asset USDT --leverage 1,2,3,5 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdt-1000:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdt_1000 --total-cash 1000
      --margin-asset USDT --leverage 1,2,3,5 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdt-1250:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdt_1250 --total-cash 1250
      --margin-asset USDT --leverage 1,2,3,5 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdt-1500:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdt_1500 --total-cash 1500
      --margin-asset USDT --leverage 1,2,3,5 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdc-500:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdc_500 --total-cash 500
      --margin-asset USDC --leverage 1,2,3,5,10,20 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdc-750:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdc_750 --total-cash 750
      --margin-asset USDC --leverage 1,2,3,5,10,20 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdc-1000:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdc_1000 --total-cash 1000
      --margin-asset USDC --leverage 1,2,3,5,10,20 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdc-1250:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdc_1250 --total-cash 1250
      --margin-asset USDC --leverage 1,2,3,5,10,20 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  coinflip-usdc-1500:
    <<: *bot-base
    command: >
      python -u cli/coinflip_trade.py --account coinflip_usdc_1500 --total-cash 1500
      --margin-asset USDC --leverage 1,2,3,5,10,20 --margin-pct 0.03 --poll-seconds 300
      LINK/USDT TIA/USDT DOT/USDT ETH/USDT WIF/USDT AVAX/USDT SOL/USDT ARB/USDT

  webapp:
    build: .
    command: gunicorn -w 2 -b 0.0.0.0:8080 webapp.app:app
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./paper_state:/app/paper_state
    restart: unless-stopped
    depends_on:
      - bot-500
      - bot-1000
      - bot-2000
      - bot-4000
      - bot-8000
      - coinflip-usdt-500
      - coinflip-usdt-750
      - coinflip-usdt-1000
      - coinflip-usdt-1250
      - coinflip-usdt-1500
      - coinflip-usdc-500
      - coinflip-usdc-750
      - coinflip-usdc-1000
      - coinflip-usdc-1250
      - coinflip-usdc-1500
